# Server Configuration
server.port=${PORT:8080}

# Database Configuration (Aiven MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-e157e1e-ajayytube9260-6469.g.aivencloud.com:12964/defaultdb?useSSL=true&requireSSL=true&verifyServerCertificate=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Config (HMAC SHA-256 requires key of at least 256 bits / 32 bytes)
jwt.secret=${JWT_SECRET:RentMyVehicleSuperSecretKeyWhichMustBeAtLeast256BitsLongForHmacSha256Algorithm}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google Cloud Storage Config
gcs.bucket-name=${GCS_BUCKET_NAME:rent-my-vehicle-assets}
gcs.credentials-path=${GCS_CREDENTIALS_PATH:google-credentials.json}

# Razorpay Test Credentials (Replace with actual ones if required, otherwise mock checkout is active)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_dummy}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:dummy_secret}

# Enable HTTP Request / Response Logging or Multipart for uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Spring Mail SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:ajaywaghmare190504@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Custom CORS Allowed Origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
